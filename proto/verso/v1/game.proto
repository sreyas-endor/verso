// Verso wire protocol — the single source of truth for both the Go server and
// the TypeScript client. Generated by `buf generate` into internal/gen (Go) and
// web/gen (TS). Never hand-edit the generated output.
//
// BROADCAST vs UNICAST — see IMPLEMENTATION_PLAN.md §4.2.
//
// Every player holds a secret word. One player's word differs from everyone
// else's. A player's word must never reach another player's client. The
// protocol enforces that structurally: the secret-bearing payloads are sibling
// variants of the same `oneof` as the room-wide ones, so the union stays closed
// and the secret has no home on a type that can be broadcast.
//
//   ServerEvent.evt, broadcast half — safe for every socket in the room:
//     lobby_state, settings_changed, round_started, turn_started, stroke_began,
//     stroke_points, stroke_ended, phase_changed, vote_cast_count, vote_tally,
//     player_eliminated, match_ended, player_presence, error
//
//   ServerEvent.evt, unicast half — addressed to exactly one player, never
//   passed to Broadcast:
//     joined, your_word, snapshot, spectator_info, vote_accepted
//
// In Go the split is re-stated as a compile-time marker interface: package
// `room` wraps each broadcast-safe payload in a type carrying an unexported
// `broadcastSafe()` method, and deliberately omits that method from the unicast
// wrappers. Methods are invisible to protoc-gen-go, so regenerating this file
// can never erase that defense. See internal/room/audience.go.
//
// A private variant is NEVER made by embedding a public one. In the generated
// TypeScript, `{ ...Public, secret }` is a structural subtype of `Public` and
// would be accepted anywhere the public message is expected — which is exactly
// the bug being prevented. Sibling messages with duplicated fields only.
//
// WIRE RULES (IMPLEMENTATION_PLAN.md §4.3):
//   - int32 / sint32 only. int64 and uint64 generate `bigint` in TS, which
//     JSON.stringify throws on. That rule is why every duration below is a
//     relative int32 millisecond count and there is not a single absolute
//     timestamp in this file.
//   - Every enum carries an explicit *_UNSPECIFIED = 0 so an older client
//     meeting a newer server degrades instead of misreading a value.
//   - Frames are protobuf binary, never ProtoJSON.

syntax = "proto3";

package verso.v1;

// Word-pair deck tier. Difficulty is visual overlap, not word obscurity
// (DESIGN.md:126). Default is DIFFICULTY_MEDIUM.
enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  DIFFICULTY_EASY = 1;
  DIFFICULTY_MEDIUM = 2;
  DIFFICULTY_HARD = 3;
}

// How much the artist may use their turn with. A host-set handicap, not a
// difficulty knob: it constrains the pen, never the word.
//
// The limit is a per-turn stroke ceiling and nothing else. Running out locks
// the pen for the rest of the turn; it never ends the turn early, because
// pointercancel fires on app switch, orientation change and palm rejection,
// and none of those should cost somebody their turn.
enum PenRule {
  PEN_RULE_UNSPECIFIED = 0;
  // Draw as much as the clock allows. The per-turn caps in
  // IMPLEMENTATION_PLAN.md §4.7 still apply — they are anti-abuse, not rules.
  PEN_RULE_FREE = 1;
  // One unbroken stroke. Lifting the pen finishes the artist's drawing.
  PEN_RULE_ONE_LINE = 2;
  // Five strokes for the whole turn.
  PEN_RULE_MAX_FIVE = 3;
}

// What a valid elimination discloses to the players still in the match
// (MULTIPLE_IMPOSTERS.md, "Elimination Results"). Vote totals are aggregate-only
// either way; this never makes an individual ballot visible.
//
// It governs the NON-TERMINAL result only. The elimination that ends the match
// is followed by MatchEnded, which reveals everything on purpose
// (DESIGN.md:75), so Hidden cannot and does not conceal that one.
enum EliminationResults {
  ELIMINATION_RESULTS_UNSPECIFIED = 0;
  // The public result names the eliminated player's alignment.
  ELIMINATION_RESULTS_REVEAL = 1;
  // The public result names only who went, never which side they were on.
  ELIMINATION_RESULTS_HIDDEN = 2;
}

// Server-authoritative match phase (IMPLEMENTATION_PLAN.md §4.5).
//
// Discussion and voting share one combined timer (DESIGN.md:46), so they are a
// single phase here rather than the two the prose implies.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  // Pre-match: players join, set ready, host edits settings.
  PHASE_LOBBY = 1;
  // Words dealt; each player is shown their own word and nothing else. Opens
  // EVERY round, not just the match: each round wipes the canvas and deals a
  // fresh pair. PhaseChanged.round tells the two apart — 0 is the match
  // opening, n >= 1 is the reveal for round n+1, so a client can archive the
  // finished canvas before clearing it.
  PHASE_ASSIGNING = 2;
  // One turn per active player, turn order reshuffled every round.
  PHASE_DRAWING = 3;
  // Combined discussion + voting window.
  PHASE_DISCUSSION = 4;
  // Tally, plurality check, elimination, win-condition evaluation.
  PHASE_RESOLVING = 5;
  // Final reveal is on the wire; only Rematch is accepted.
  PHASE_ENDED = 6;
  // A short, server-timed handoff before a drawing turn or voting opens.
  PHASE_INTERMISSION = 7;
}

// Which side won the match (DESIGN.md:71).
enum WinnerSide {
  WINNER_SIDE_UNSPECIFIED = 0;
  WINNER_SIDE_GROUP = 1;
  WINNER_SIDE_IMPOSTER = 2;
}

// Why the match ended. Clients render the same final reveal either way; this
// only drives the headline text.
enum MatchEndReason {
  MATCH_END_REASON_UNSPECIFIED = 0;
  // Imposter won the vote outright and was eliminated (DESIGN.md:64).
  MATCH_END_REASON_IMPOSTER_ELIMINATED = 1;
  // Imposter still active after the configured final round (DESIGN.md:71).
  MATCH_END_REASON_FINAL_ROUND_SURVIVED = 2;
  // Only two active players remain (DESIGN.md:72).
  MATCH_END_REASON_TWO_PLAYERS_REMAIN = 3;
  // Imposter's grace window expired; group wins (DESIGN.md:119).
  MATCH_END_REASON_IMPOSTER_DISCONNECTED = 4;
  // Too few players remain seated to continue at all.
  MATCH_END_REASON_ABANDONED = 5;
}

// Machine-readable failure reason on an Error event. The `cid` on the
// ServerEvent carries it back to the command that caused it.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_ROOM_NOT_FOUND = 1;
  ERROR_CODE_ROOM_FULL = 2;
  ERROR_CODE_MATCH_IN_PROGRESS = 3;
  ERROR_CODE_BAD_SEAT = 4;
  ERROR_CODE_NOT_HOST = 5;
  ERROR_CODE_NOT_ARTIST = 6;
  ERROR_CODE_ALREADY_VOTED = 7;
  ERROR_CODE_INVALID_SETTINGS = 8;
  ERROR_CODE_NOT_ENOUGH_PLAYERS = 9;
  ERROR_CODE_NOT_READY = 10;
  ERROR_CODE_INVALID_COMMAND = 11;
  ERROR_CODE_NOT_ACTIVE = 12;
  ERROR_CODE_RATE_LIMITED = 13;
  ERROR_CODE_WRONG_PHASE = 14;
  ERROR_CODE_PROTOCOL_VERSION = 15;
  // The host removed this player from the lobby. Terminal: the seat and its
  // token are gone, so a reconnect with that token cannot succeed.
  ERROR_CODE_KICKED = 16;
}

// Host-configured match parameters (DESIGN.md:224). The server clamps every
// field to the documented range and echoes the clamped result back in
// SettingsChanged; a client must never assume its request was taken verbatim.
message MatchSettings {
  // Deck tier. Default DIFFICULTY_MEDIUM.
  Difficulty difficulty = 1;
  // Maximum rounds. Range 1..4, default 2.
  int32 max_rounds = 2;
  // Drawing time per turn, in whole seconds. Range 5..60, default 15.
  int32 draw_seconds = 3;
  // Combined discussion-and-decision time, in whole seconds.
  // Range 30..180, default 120.
  int32 discuss_seconds = 4;
  // Handoff time before every drawing turn and voting window. Range 3..30,
  // default 10.
  int32 intermission_seconds = 5;
  // Per-turn pen handicap. Default PEN_RULE_FREE. An unknown value becomes the
  // default like every other field here, so a newer client cannot hand this
  // room a rule it does not enforce.
  PenRule pen_rule = 6;
  // How many seats hold the odd word. Range 1..2, default 1
  // (MULTIPLE_IMPOSTERS.md, "Match Settings").
  //
  // Public: it is a lobby setting every player can read, which is exactly why
  // YourWord does not carry it. Legal at every supported player count — three
  // players with two imposters is unwinnable for the group and the lobby warns
  // about it rather than refusing it.
  int32 imposter_count = 7;
  // What a non-terminal elimination discloses. Default
  // ELIMINATION_RESULTS_REVEAL.
  EliminationResults elimination_results = 8;
}

// Public roster entry. Contains nothing a player is not allowed to know about
// somebody else — in particular, never a word.
message PlayerInfo {
  string id = 1;
  string name = 2;
  // Seat index in join order. Stable for the life of the room, and the
  // tiebreak for host migration (longest-connected active player wins).
  int32 seat = 3;
  bool connected = 4;
  bool ready = 5;
  bool is_host = 6;
  // Eliminated players are silent spectators (DESIGN.md:66).
  bool eliminated = 7;
}

// A committed stroke, replayed in Snapshot. Carries no artist id: the finished
// canvas retains no authorship attribution (DESIGN.md:40).
message Stroke {
  int32 stroke_id = 1;
  // Index into the server-owned palette, never a CSS color string.
  int32 color_index = 2;
  // Already clamped by the server.
  int32 width = 3;
  // Flat interleaved x,y pairs on the 4096x3072 signed grid. Length is even.
  repeated sint32 points = 4;
}

// ---------------------------------------------------------------------------
// Client -> server commands
// ---------------------------------------------------------------------------

// Join a room, or reclaim a seat after a socket drop.
message JoinRoom {
  string room_code = 1;
  // Ignored when seat_token is presented and valid; the seated name wins.
  string display_name = 2;
  // Opaque token from a previous Joined. Empty for a fresh join.
  string seat_token = 3;
  // Bumped whenever a change to this file is not backward compatible.
  int32 protocol_version = 4;
}

message SetReady {
  bool ready = 1;
}

// Host only. Rejected with ERROR_CODE_NOT_HOST otherwise, and with
// ERROR_CODE_WRONG_PHASE outside the lobby.
message UpdateSettings {
  MatchSettings settings = 1;
}

// Host only. Requires 3..10 seated players, all ready.
message StartMatch {}

// Remove another player's seat. Host only, and lobby only: outside
// PHASE_LOBBY a seat holds a word and a place in the turn order and the vote
// denominator, none of which a removal may quietly rewrite.
//
// Rejected with ERROR_CODE_NOT_HOST from a non-host, ERROR_CODE_WRONG_PHASE
// outside the lobby, and ERROR_CODE_INVALID_COMMAND for an unknown id or for
// the host's own id — a host leaves by closing the tab, which migrates the
// role, rather than by unseating themself.
//
// The removed player is told with an ERROR_CODE_KICKED Error and their seat
// token is destroyed, so they cannot reconnect into that seat. This does NOT
// ban them: the room code still works and they may take a fresh seat.
message KickPlayer {
  string target_player_id = 1;
}

// Begin a stroke. Rejected from anyone who is not the current artist.
message StrokeBegin {
  // Palette index; out-of-range values are rejected, not clamped.
  int32 color_index = 1;
  // Server clamps to its own min/max before echoing.
  int32 width = 2;
  // The first sample, as one interleaved x,y pair.
  repeated sint32 points = 3;
}

// Points appended to the artist's currently open stroke.
//
// Shared between both directions, per IMPLEMENTATION_PLAN.md §4.3. A client
// fills in `points` only: there is exactly one open stroke per artist, so the
// server resolves the target itself and OVERWRITES stroke_id and seq on the
// event it broadcasts. The server never trusts a client-supplied stroke_id or
// seq, and a client must never read back its own.
message StrokePoints {
  int32 stroke_id = 1;
  // Flat interleaved x,y pairs on the 4096x3072 signed grid. Length is even.
  // Batched client-side at 50 ms, so 3-6 pairs in the common case.
  repeated sint32 points = 2;
  // Monotonic per room. A gap tells the client to send RequestSnapshot.
  int32 seq = 3;
}

// Finish the artist's currently open stroke.
message StrokeEnd {
  // RDP-simplified replacement for the whole stroke, computed once on
  // pointerup. Empty means keep exactly what was streamed.
  repeated sint32 points = 1;
}

// One anonymous, irreversible vote (DESIGN.md:51). Valid choices are any active
// player, the voter themself, or Skip.
message CastVote {
  oneof choice {
    string candidate_id = 1;
    // Must be true when set. Skip is a deliberate answer that competes for
    // first place in the tally, NOT the default for silence: a player who never
    // answers abstains and is counted in no bucket at all (DESIGN.md:52).
    bool skip = 2;
  }
}

// Ask for a full resync. Sent on a seq gap or on reconnect.
message RequestSnapshot {
  // Highest stroke seq the client has applied. Advisory only — the server
  // always answers with the complete state, never a delta.
  int32 have_seq = 1;
}

// Return the room to the lobby after a match (DESIGN.md:78). Host only.
message Rematch {}

// The only frame a client is ever allowed to send.
message ClientCommand {
  // Correlation id, echoed on the ServerEvent this command produced. Opaque to
  // the server. May be empty for fire-and-forget commands such as StrokePoints.
  string cid = 1;
  oneof cmd {
    JoinRoom join = 2;
    SetReady set_ready = 3;
    UpdateSettings update_settings = 4;
    StartMatch start_match = 5;
    StrokeBegin stroke_begin = 6;
    StrokePoints stroke_points = 7;
    StrokeEnd stroke_end = 8;
    CastVote cast_vote = 9;
    RequestSnapshot request_snapshot = 10;
    Rematch rematch = 11;
    KickPlayer kick = 12;
  }
}

// ---------------------------------------------------------------------------
// Server -> client events, broadcast half
// ---------------------------------------------------------------------------

// Full lobby roster and settings. Re-sent on every roster or settings change
// while in PHASE_LOBBY.
message LobbyState {
  string room_code = 1;
  repeated PlayerInfo players = 2;
  MatchSettings settings = 3;
  Phase phase = 4;
  int32 min_players = 5;
  int32 max_players = 6;
  // True when the host may send StartMatch right now.
  bool can_start = 7;
}

// Host changed the settings. Values are already clamped to the documented
// ranges.
message SettingsChanged {
  MatchSettings settings = 1;
}

// A round begins. Turn order is reshuffled independently every round
// (DESIGN.md:36).
message RoundStarted {
  // 1-based.
  int32 round = 1;
  int32 total_rounds = 2;
  // Active player ids, in the order they will draw this round.
  repeated string turn_order = 3;
  int32 active_count = 4;
}

// One drawing turn begins. The interface identifies the artist while they draw
// (DESIGN.md:39); the finished canvas does not (DESIGN.md:40).
message TurnStarted {
  int32 round = 1;
  // 0-based index into RoundStarted.turn_order.
  int32 turn_index = 2;
  string artist_id = 3;
  // Whole turn length, in milliseconds.
  int32 duration_ms = 4;
  // Milliseconds left at send time. Equals duration_ms except inside a
  // Snapshot-driven resync.
  int32 remaining_ms = 5;
}

// The artist started a stroke. No artist id: the canvas is anonymous.
message StrokeBegan {
  int32 stroke_id = 1;
  int32 color_index = 2;
  // Post-clamp width.
  int32 width = 3;
  // Flat interleaved x,y pairs. Length is even.
  repeated sint32 points = 4;
  // Monotonic per room. A gap tells the client to send RequestSnapshot.
  int32 seq = 5;
}

// The artist's stroke is committed. Nothing further may be appended to it.
message StrokeEnded {
  int32 stroke_id = 1;
  // Final geometry when the server accepted an RDP-simplified replacement;
  // empty when the streamed points stand. Clients that receive points here MUST
  // replace the stroke rather than append.
  repeated sint32 points = 2;
  int32 seq = 3;
}

// Phase transition, with the authoritative clock for the new phase.
message PhaseChanged {
  Phase phase = 1;
  int32 round = 2;
  // Whole phase length in milliseconds; 0 for an untimed phase.
  int32 duration_ms = 3;
  // Milliseconds left at send time.
  int32 remaining_ms = 4;
  // Set only for PHASE_INTERMISSION when the next activity is a drawing turn.
  // Empty means the following activity is voting.
  string next_artist_id = 5;
}

// Progress of the voting window. Aggregate only — this message exists so the
// UI can show "4 of 6 voted" without ever learning WHO voted (DESIGN.md:56).
message VoteCastCount {
  int32 round = 1;
  int32 votes_cast = 2;
  // Denominator: every connected, non-eliminated player. A disconnected seat
  // leaves it, so the numerator and the denominator move together.
  int32 active_count = 3;
}

// Per-candidate total for the vote result screen.
message VoteCount {
  string candidate_id = 1;
  int32 votes = 2;
}

// Aggregate tally only. The server never emits, logs, or retains a mapping from
// voter to candidate (DESIGN.md:56).
//
// Elimination is a plurality with Skip on the ballot (DESIGN.md:58): the
// candidate strictly ahead of every other candidate AND strictly ahead of
// skip_count is eliminated, and any tie for first — including a tie with Skip —
// eliminates nobody.
message VoteTally {
  int32 round = 1;
  // Candidates with at least one vote. Order is not significant.
  repeated VoteCount counts = 2;
  // Explicit Skip votes only. It is a competitor for first place, not the
  // remainder of active_count: abstentions appear in no bucket, so
  // sum(counts) + skip_count can be less than active_count.
  int32 skip_count = 3;
  int32 active_count = 4;
  // Always 0. Elimination is a plurality, so there is no threshold to publish;
  // the field is retained rather than reused so a stale client cannot read a
  // recycled field number as a vote count.
  int32 majority_threshold = 5 [deprecated = true];
}

// Outcome of the tally. Always sent after VoteTally, including when nobody
// reached a majority.
message PlayerEliminated {
  int32 round = 1;
  // False when no candidate finished strictly ahead of both every other
  // candidate and Skip; nobody is eliminated and the next round begins
  // (DESIGN.md:59).
  bool eliminated = 2;
  // Empty when eliminated is false.
  string player_id = 3;
  // The eliminated player's alignment. Meaningless unless alignment_revealed
  // is true, and the server leaves it false in that case rather than sending a
  // value a careless client could read.
  //
  // With ELIMINATION_RESULTS_REVEAL and two imposters this is true for the
  // FIRST imposter caught, in a resolution the match survives — the base
  // design's "only ever true alongside a group win" no longer holds. The group
  // win is the separate MatchEnded, not this flag.
  bool was_imposter = 4;
  // Whether was_imposter carries a verdict at all.
  //
  // True under ELIMINATION_RESULTS_REVEAL, and true for the elimination that
  // ends the match under either setting, because the MatchEnded that follows
  // discloses every alignment anyway. False under ELIMINATION_RESULTS_HIDDEN
  // for a result the match survives: the room is told who went and nothing
  // else. Also false when eliminated is false, where there is nobody to have
  // an alignment.
  bool alignment_revealed = 5;
}

// One round's pair, revealed only when the match is over. Every round deals a
// fresh pair from a different cluster (DESIGN.md:36), so a match has as many
// of these as it played rounds.
message RoundWords {
  // 1-based, and always equal to this message's position in
  // MatchEnded.rounds + 1. Carried explicitly so a reader never has to infer
  // it from an index.
  int32 round = 1;
  string common_word = 2;
  string imposter_word = 3;
}

// One row of the final reveal (DESIGN.md:75).
message PlayerReveal {
  string player_id = 1;
  string name = 2;
  // The word this player held in the LAST round they were dealt into, which
  // for anyone still standing is the final round. Safe here and nowhere else:
  // the match is over.
  string word = 3;
  bool was_imposter = 4;
  bool eliminated = 5;
  // This player's word for every round, positionally aligned with
  // MatchEnded.rounds — words[i] belongs to rounds[i]. Empty string for a
  // round this player was not dealt into, which is every round after the one
  // that eliminated them.
  repeated string words = 6;
}

// Final reveal. This is the ONLY broadcast that carries assigned words, and it
// is emitted only in PHASE_ENDED.
message MatchEnded {
  WinnerSide winner = 1;
  MatchEndReason reason = 2;
  // The FINAL round's pair — the one that was live when the match ended. The
  // whole match is in `rounds`; these two stay for the headline, which names
  // one pair.
  string common_word = 3;
  string imposter_word = 4;
  // Superseded by imposter_player_ids. A single id could only ever describe a
  // one-imposter match, and a client reading it in a two-imposter match would
  // name one of the pair and silently lose the other. Reserved rather than
  // repurposed, so a stale build cannot read the new list through the old
  // field number.
  reserved 5;
  reserved "imposter_player_id";
  // Every player who was dealt a word in any round, eliminated or not.
  repeated PlayerReveal reveals = 6;
  int32 rounds_played = 7;
  // Every round's pair, oldest first. len(rounds) == rounds_played whenever
  // the match got past assignment.
  repeated RoundWords rounds = 8;
  // Every imposter seat, in seat order. Chosen once at match start and pinned
  // for the whole match: every round re-deals the words, none of them re-rolls
  // this. Length equals MatchSettings.imposter_count.
  repeated string imposter_player_ids = 9;
}

// A player's connection state or host flag changed. Also the host-migration
// announcement: the promoted player arrives here with is_host set.
message PlayerPresence {
  PlayerInfo player = 1;
  // Seconds left in the 60 s reconnect grace window. 0 when connected.
  int32 grace_seconds_remaining = 2;
}

// A command was rejected, or the room is shutting down.
message Error {
  ErrorCode code = 1;
  // Human-readable, English, safe to display. Never contains a word.
  string message = 2;
}

// ---------------------------------------------------------------------------
// Server -> client events, unicast half.
//
// None of these may ever be passed to Broadcast. The Go wrappers for all five
// deliberately lack the broadcastSafe() marker.
// ---------------------------------------------------------------------------

// Seat granted. The seat_token is the bearer credential for reconnecting into
// this exact seat, so it goes to one socket only.
message Joined {
  string room_code = 1;
  string player_id = 2;
  // Opaque, server-signed. Present verbatim in a later JoinRoom.
  string seat_token = 3;
  // Reconnect grace window.
  int32 grace_seconds = 4;
  bool is_host = 5;
  // True when this was a seat reclaim rather than a fresh join.
  bool reconnected = 6;
  int32 protocol_version = 7;
}

// THE SECRET. A sibling variant of the broadcast messages above, deliberately
// not a field on any of them: the word has no home on a broadcastable type
// (IMPLEMENTATION_PLAN.md §4.2). Exactly one player in the room receives a
// different string here, and no player is told which (DESIGN.md:31).
//
// Its Go wrapper has no broadcastSafe() method, so Broadcast(EvYourWord{...})
// fails at compile time.
message YourWord {
  string word = 1;
  // The round this word is for, 1-based. Every round deals a fresh pair, so a
  // player receives one of these per round, during the PHASE_ASSIGNING reveal
  // that opens it. A client MUST replace the word it is holding rather than
  // treat a second YourWord as a duplicate.
  int32 round = 2;
}

// Full state for a reconnecting or resyncing client. Unicast because it
// contains the recipient's own word.
message Snapshot {
  string room_code = 1;
  // The recipient. A client should assert this matches its own id.
  string player_id = 2;
  Phase phase = 3;
  int32 round = 4;
  int32 total_rounds = 5;
  MatchSettings settings = 6;
  repeated PlayerInfo players = 7;
  // The order this round draws in, and still the order it votes in
  // (DESIGN.md:60). Empty before the first round of a match, and cleared when
  // the round ends: the next round reshuffles.
  repeated string turn_order = 8;
  // 0-based index of the live turn, and len(turn_order) once every turn is
  // done — including for the whole discussion and result.
  int32 turn_index = 9;
  string artist_id = 10;
  // Milliseconds left in the current phase or turn; 0 when untimed.
  int32 remaining_ms = 11;
  // The whole canvas, replayed in one message. There is no incremental
  // catch-up path (IMPLEMENTATION_PLAN.md §4.6).
  repeated Stroke strokes = 12;
  // Highest stroke seq included above.
  int32 seq = 13;
  // THE SECRET, again — the recipient's own word only, empty in PHASE_LOBBY.
  // This field is why Snapshot has no broadcastSafe() marker. Carrying it here
  // rather than in a separate follow-up event is deliberate: it removes any
  // ordering window in which a reconnected client is mid-match without a word.
  string your_word = 14;
  bool you_are_eliminated = 15;
  // True when the recipient has already voted this round. The votes of others
  // are never disclosed, only their count.
  bool you_have_voted = 16;
  int32 votes_cast = 17;
  int32 active_count = 18;
  // Same meaning as PhaseChanged.next_artist_id while in PHASE_INTERMISSION.
  string next_artist_id = 19;
}

// One imposter's public identity, named privately to a spectator. The name is
// carried rather than looked up so a dossier renders without a roster join.
message SpectatorImposter {
  string player_id = 1;
  string name = 2;
}

// One seat's dealt word for one round. SPECTATOR-ONLY: this is another player's
// secret, and it may appear on no message an active player can receive.
message SpectatorAssignment {
  string player_id = 1;
  string word = 2;
  // Redundant with comparing `word` against SpectatorRound.imposter_word, and
  // carried anyway so a renderer never has to compare two strings to colour a
  // row.
  bool is_imposter = 3;
}

// One round, seen from behind the scenes.
message SpectatorRound {
  // 1-based, matching RoundWords.round.
  int32 round = 1;
  string common_word = 2;
  string imposter_word = 3;
  // Every seat dealt into this round, in seat order. A seat already eliminated
  // when the round was dealt is absent rather than blank.
  repeated SpectatorAssignment assignments = 4;
  // This round's finished canvas, replayed the same way Snapshot replays the
  // live one. Empty for the round still being drawn, and for a round the match
  // ended part-way through.
  repeated Stroke strokes = 5;
}

// The eliminated player's private dossier (MULTIPLE_IMPOSTERS.md,
// "Eliminated-player Spectator View").
//
// Sent to a player only AFTER they are out: on the elimination itself, again on
// every later deal so a spectator watches the next round's assignments land,
// and again beside the Snapshot of a reconnect. Never to an active player, and
// never broadcast — EvSpectatorInfo has no broadcastSafe marker for exactly
// this reason.
//
// It is cumulative and complete each time, not a delta: a spectator who
// reconnects three rounds later gets the whole match back in one frame, which
// is the same reason Snapshot replays the entire stroke log.
message SpectatorInfo {
  // Superseded by `imposters`. One id and one name could only ever describe a
  // single-imposter match. Reserved rather than repurposed so a stale build
  // cannot read the new list through the old field numbers.
  reserved 1, 2;
  reserved "imposter_player_id", "imposter_name";

  // Every imposter seat, in seat order. Length equals
  // MatchSettings.imposter_count.
  repeated SpectatorImposter imposters = 3;
  // Every round dealt so far, oldest first, including the one in progress.
  repeated SpectatorRound rounds = 4;
}

// Private acknowledgement that the voter's own irreversible vote was recorded.
// Unicast because knowing a specific player's choice is exactly what
// DESIGN.md:56 forbids disclosing.
message VoteAccepted {
  int32 round = 1;
  // Empty when the recorded choice was Skip.
  string candidate_id = 2;
  bool skip = 3;
}

// The only frame a server is ever allowed to send.
message ServerEvent {
  // Echoes ClientCommand.cid when this event answers a specific command; empty
  // for spontaneous events such as a phase expiry.
  string cid = 1;
  oneof evt {
    // -- broadcast: safe for every socket in the room --
    LobbyState lobby_state = 2;
    SettingsChanged settings_changed = 3;
    RoundStarted round_started = 4;
    TurnStarted turn_started = 5;
    StrokeBegan stroke_began = 6;
    StrokePoints stroke_points = 7;
    StrokeEnded stroke_ended = 8;
    PhaseChanged phase_changed = 9;
    VoteCastCount vote_cast_count = 10;
    VoteTally vote_tally = 11;
    PlayerEliminated player_eliminated = 12;
    MatchEnded match_ended = 13;
    PlayerPresence player_presence = 14;
    Error error = 15;

    // -- unicast only: one addressee, never Broadcast --
    Joined joined = 16;
    YourWord your_word = 17;
    Snapshot snapshot = 18;
    SpectatorInfo spectator_info = 19;
    VoteAccepted vote_accepted = 20;
  }
}
