version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sreyas-endor/verso/internal/gen
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: ./web/node_modules/.bin/protoc-gen-es
    out: web/gen
    opt:
      - target=ts
      - import_extension=js
