<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ships with the env(safe-area-inset-*) padding in
         layout.css and only with it: without that padding this would slide the
         appbar and the canvas under the notch. Zoom stays available — no
         user-scalable, no maximum-scale (WCAG 2.0 SC 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f7cff" />
    <meta name="description" content="A real-time imposter drawing game." />
    <title>Verso</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
